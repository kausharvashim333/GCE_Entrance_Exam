                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('bold', false, null); }} className="px-3 py-1 text-sm font-semibold rounded hover:bg-slate-200" title="Bold">B</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('italic', false, null); }} className="px-3 py-1 text-sm italic rounded hover:bg-slate-200" title="Italic">I</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('underline', false, null); }} className="px-3 py-1 text-sm underline rounded hover:bg-slate-200" title="Underline">U</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('subscript', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Subscript">X₂</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('superscript', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Superscript">X²</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('insertUnorderedList', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Bullet List">• List</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('insertOrderedList', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Numbered List">1. List</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('justifyLeft', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Align Left">←</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('justifyCenter', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Align Center">↔</button>
                <button type="button" onClick={(e) => { e.preventDefault(); document.execCommand('justifyRight', false, null); }} className="px-3 py-1 text-sm rounded hover:bg-slate-200" title="Align Right">→</button>
              </div>
              <div
                contentEditable
                suppressContentEditableWarning
                onInput={(e) => setForm({ ...form, resultInstructions: e.target.innerHTML })}
                className="w-full px-4 py-3 min-h-[100px] focus:outline-none"
                dangerouslySetInnerHTML={{ __html: form.resultInstructions || "" }}
              ></div>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 className="text-lg font-semibold">Logo Upload</h3>
              <p className="text-sm text-slate-500">PNG, JPG or SVG up to 2MB. Transparent background recommended.</p>
              <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl px-6 py-10 cursor-pointer hover:border-blue-400">
                {uploading ? (
                  <span className="text-blue-600 font-semibold">Uploading...</span>
                ) : (
                  <>
                    <span className="text-lg font-semibold text-slate-700">Drop logo here</span>
                    <span className="text-sm text-slate-500">or click to browse</span>
                  </>
                )}
                <input type="file" className="hidden" accept="image/*" onChange={handleLogoUpload} />
              </label>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 className="text-lg font-semibold">Signature Upload</h3>
              <p className="text-sm text-slate-500">PNG, JPG up to 2MB. Transparent background recommended.</p>
              <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl px-6 py-10 cursor-pointer hover:border-blue-400">
                {uploading ? (
                  <span className="text-blue-600 font-semibold">Uploading...</span>
                ) : (
                  <>
                    <span className="text-lg font-semibold text-slate-700">Drop signature here</span>
                    <span className="text-sm text-slate-500">or click to browse</span>
                  </>
                )}
                <input type="file" className="hidden" accept="image/*" onChange={handleSignatureUpload} />
              </label>
            </div>
          </div>
        </div>
      );
    }

    function StudentDashboard() {
      const [exams, setExams] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      
      useEffect(() => {
        api.get("/exams/student")
          .then((res) => setExams(res.data || []))
          .catch((err) => {
            console.error("Failed to fetch exams:", err);
            setError("Failed to load exams");
          })
          .finally(() => setLoading(false));
      }, []);

      return (
        <div className="space-y-6">
          <div>
            <h1 className="text-2xl font-bold text-slate-800">My Exams</h1>
            <p className="text-slate-500">Upcoming exams and recent attempts.</p>
          </div>

          {loading && <p className="text-slate-500">Loading exams...</p>}
          {error && <p className="text-red-600">{error}</p>}

          <div className="grid gap-4">
            {exams.map((exam) => (
              <div key={exam._id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                  <div>
                    <p className="text-sm text-slate-500">{exam.subjects?.join(", ") || "N/A"}</p>
                    <h3 className="text-xl font-semibold text-slate-800">{exam.title}</h3>
                    <p className="text-xs text-slate-500 mt-1">Status: {exam.status || "N/A"}</p>
                  </div>
                  <div className="text-sm text-slate-500">
                    {formatDate(exam.startTime)} → {formatDate(exam.endTime)}
                  </div>
                  <div className="flex gap-3">
                    {exam.attempted ? (
                      <span className="px-3 py-1 rounded-full text-sm bg-green-100 text-green-600">Submitted</span>
                    ) : (
                      <Link
                        className="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700"
                        to={`/student/exam/${exam._id}`}
                      >
                        Start Exam
                      </Link>
                    )}
                  </div>
                </div>
              </div>
            ))}
            {!loading && exams.length === 0 && <p className="text-slate-500">No exams assigned yet.</p>}
          </div>
        </div>
      );
    }

    function ExamPage() {
      const { user } = useAuth();
      const { id } = ReactRouterDOM.useParams();
      const [exam, setExam] = useState(null);
      const [answers, setAnswers] = useState({});
      const [showInstructions, setShowInstructions] = useState(true);
      const [instructionsAccepted, setInstructionsAccepted] = useState(false);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [timeLeft, setTimeLeft] = useState(0);
      const [tabSwitchCount, setTabSwitchCount] = useState(0);
      const [showWarning, setShowWarning] = useState(false);
      const [idleTime, setIdleTime] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [resultData, setResultData] = useState(null);
      const navigate = useNavigate();

      useEffect(() => {
        localStorage.setItem(`exam_${id}_active`, Date.now().toString());
        const checkMultipleTabs = setInterval(() => {
          const activeTime = localStorage.getItem(`exam_${id}_active`);
          if (activeTime && Date.now() - parseInt(activeTime) > 5000) {
            console.log("Multiple tab detected");
            localStorage.setItem(`exam_${id}_active`, Date.now().toString());
          }
        }, 1000);

        return () => {
          clearInterval(checkMultipleTabs);
          localStorage.removeItem(`exam_${id}_active`);
        };
      }, [id, navigate]);

      useEffect(() => {
        api.get(`/exams/${id}/start`).then((res) => {
          setExam(res.data);
          const initialAnswers = {};
          res.data.questions.forEach((q) => (initialAnswers[q.id] = null));
          setAnswers(initialAnswers);
        }).catch((err) => alert(err.response?.data?.message || "Unable to start exam"));
      }, [id]);

      useEffect(() => {
        if (exam && !showInstructions) {
          setTimeLeft(exam.durationMinutes * 60);
        }
      }, [exam, showInstructions]);

      useEffect(() => {
        let timer;
        if (timeLeft > 0 && !showInstructions) {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                handleSubmit();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [timeLeft, showInstructions]);

      useEffect(() => {
        // Idle timeout disabled to prevent unwanted exam termination
        // Uncomment below to enable idle timeout
        /*
        let idleTimer;
        if (!showInstructions) {
          const resetIdleTimer = () => {
            setIdleTime(0);
          };

          const events = ['mousemove', 'keydown', 'click', 'scroll'];
          events.forEach(event => {
            window.addEventListener(event, resetIdleTimer);
          });

          idleTimer = setInterval(() => {
            setIdleTime((prev) => {
              if (prev >= 300) { // 5 minutes idle
                alert("You have been inactive for 5 minutes. Exam will be submitted automatically.");
                handleSubmit();
                return 0;
              }
              return prev + 1;
            });
          }, 1000);

          return () => {
            clearInterval(idleTimer);
            events.forEach(event => {
              window.removeEventListener(event, resetIdleTimer);
            });
          };
        }
        */
      }, [showInstructions]);

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.hidden && !showInstructions && exam.enableSecurity !== false) {
            setTabSwitchCount((prev) => prev + 1);
            setShowWarning(true);
            setTimeout(() => setShowWarning(false), 3000);
          }
        };

        const handleCopyPaste = (e) => {
          if (!showInstructions && exam.enableSecurity !== false) {
            e.preventDefault();
            alert("Copy-paste is disabled during exam");
          }
        };

        const handleContextMenu = (e) => {
          if (!showInstructions && exam.enableSecurity !== false) {
            e.preventDefault();
          }
        };

        const handleDevTools = (e) => {
          if (!showInstructions && exam.enableSecurity !== false) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.shiftKey && e.key === 'C') || (e.ctrlKey && e.shiftKey && e.key === 'J')) {
              e.preventDefault();
              alert("Developer tools are disabled during exam");
            }
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('copy', handleCopyPaste);
        document.addEventListener('paste', handleCopyPaste);
        document.addEventListener('contextmenu', handleContextMenu);
        document.addEventListener('keydown', handleDevTools);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('copy', handleCopyPaste);
          document.removeEventListener('paste', handleCopyPaste);
          document.removeEventListener('contextmenu', handleContextMenu);
          document.removeEventListener('keydown', handleDevTools);
        };
      }, [showInstructions, exam]);

      const handleStartExam = () => {
        setShowInstructions(false);
        setInstructionsAccepted(true);
        if (exam.enableSecurity !== false) {
          try {
            document.documentElement.requestFullscreen().catch(() => {
              console.log("Fullscreen not supported or denied");
            });
          } catch (e) {
            console.log("Fullscreen not supported");
          }
        }
      };

      const handlePrevious = () => {
        if (currentQuestion > 0) {
          setCurrentQuestion(currentQuestion - 1);
        }
      };

      const handleNext = () => {
        if (currentQuestion < exam.questions.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
        }
      };

      const handleJumpToQuestion = (index) => {
        setCurrentQuestion(index);
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      if (!exam) return <div>Loading exam...</div>;

      if (showInstructions) {
        return (
          <div className="space-y-6">
            <div className="bg-white rounded-2xl border border-slate-200 p-6">
              <h1 className="text-2xl font-bold text-slate-800 mb-4">Exam Instructions</h1>
              <div className="space-y-4 text-slate-600">
                <div className="p-4 bg-blue-50 rounded-xl">
                  <h3 className="font-semibold text-slate-800 mb-2">Exam Details</h3>
                  <p><strong>Title:</strong> {exam.title}</p>
                  <p><strong>Duration:</strong> {exam.durationMinutes} minutes</p>
                  <p><strong>Total Questions:</strong> {exam.totalQuestions}</p>
                  <p><strong>Marks per Question:</strong> {exam.marksPerQuestion}</p>
                  <p><strong>Negative Marking:</strong> {exam.negativeMarking || 0} marks per wrong answer</p>
                  <p><strong>Passing Marks:</strong> {exam.passingMarks}</p>
                </div>
                <div className="p-4 bg-amber-50 rounded-xl">
                  <h3 className="font-semibold text-slate-800 mb-2">Important Instructions</h3>
                  <ul className="list-disc list-inside space-y-1">
                    <li>Read each question carefully before answering</li>
                    <li>Once you submit the exam, you cannot change your answers</li>
                    <li>Do not refresh the page during the exam</li>
                    <li>Ensure you have a stable internet connection</li>
                    <li>Timer will start automatically once you click "Start Exam"</li>
                  </ul>
                </div>
                <div className="p-4 bg-red-50 rounded-xl">
                  <h3 className="font-semibold text-slate-800 mb-2">Security Features</h3>
                  {exam.enableSecurity !== false ? (
                    <ul className="list-disc list-inside space-y-1">
                      <li>Tab switching is monitored during the exam</li>
                      <li>Copy-paste is disabled during exam</li>
                      <li>Right-click is disabled during exam</li>
                      <li>Developer tools (F12) are disabled during exam</li>
                      <li>Fullscreen mode will be attempted on start</li>
                      <li>Auto-submit when timer expires</li>
                    </ul>
                  ) : (
                    <p>This exam is running with relaxed security settings configured by admin.</p>
                  )}
                </div>
                <div className="p-4 bg-red-50 rounded-xl">
                  <h3 className="font-semibold text-slate-800 mb-2">Warning</h3>
                  <p>Any attempt to cheat or use unfair means will result in immediate disqualification.</p>
                </div>
              </div>
              <div className="mt-6 flex gap-3">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={instructionsAccepted}
                    onChange={(e) => setInstructionsAccepted(e.target.checked)}
                    className="w-5 h-5 rounded"
                  />
                  <span className="text-slate-700">I have read and understood all instructions</span>
                </label>
              </div>
              <button
                onClick={handleStartExam}
                disabled={!instructionsAccepted}
                className="mt-4 px-8 py-3 rounded-xl bg-blue-600 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
              >
                Start Exam
              </button>
            </div>
          </div>
        );
      }

      const handleSubmit = async () => {
        if (!exam.resultId) {
          alert("Exam session not found. Please start the exam again.");
          navigate("/student");
          return;
        }

        const answeredQuestions = Object.entries(answers).filter(([_, selectedOption]) => selectedOption !== null);
        if (answeredQuestions.length === 0) {
          const confirmSubmit = confirm("You haven't answered any questions. Are you sure you want to submit?");
          if (!confirmSubmit) return;
        }

        const payload = {
          resultId: exam.resultId,
          answers: answeredQuestions.map(([questionId, selectedOption]) => ({ questionId, selectedOption })),
          timeTakenMinutes: exam.durationMinutes - Math.floor(timeLeft / 60),
        };
        
        console.log("Submitting exam with payload:", payload);
        
        try {
          const res = await api.post("/exams/submit", payload);
          console.log("Submission response:", res.data);
          setResultData({
            ...res.data,
            showResultImmediately: res.data.showResultImmediately ?? exam.showResultImmediately !== false,
          });
          setShowResult(true);
          // Auto logout after 5 seconds
          setTimeout(() => {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            delete api.defaults.headers.common["Authorization"];
            window.location.hash = "#/login";
            window.location.reload();
          }, 5000);
        } catch (err) {
          console.error("Submission error:", err);
          alert(err.response?.data?.message || "Submission failed");
        }
      };

      const handleResultClose = () => {
        setShowResult(false);
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        delete api.defaults.headers.common["Authorization"];
        window.location.hash = "#/login";
        window.location.reload();
      };

      return (
        <>
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 p-5 flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-bold text-slate-800">{exam.title}</h1>
              <p className="text-slate-500">
                Duration: {exam.durationMinutes} min · Questions: {exam.totalQuestions} · Marks/Q: {exam.marksPerQuestion}
              </p>
            </div>
            <div className="text-right">
              <p className="text-sm text-slate-500">Time Remaining</p>
              <p className={`text-2xl font-bold ${timeLeft < 60 ? 'text-red-600' : timeLeft < 300 ? 'text-amber-600' : 'text-blue-600'}`}>
                {formatTime(timeLeft)}
              </p>
            </div>
          </div>

          {showWarning && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">
              <p className="font-semibold">⚠️ Warning: Tab switching detected!</p>
              <p className="text-sm">Switching tabs is not allowed during exam. Multiple violations will result in automatic submission.</p>
              <p className="text-sm mt-1">Violations: {tabSwitchCount}/3</p>
            </div>
          )}

          <div className="flex gap-6">
            <div className="flex-1" style={{ userSelect: showInstructions ? 'auto' : 'none', WebkitUserSelect: showInstructions ? 'auto' : 'none' }}>
              {exam.questions.length > 0 && (
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                  <div className="flex justify-between items-center mb-4">
                    <p className="text-slate-500 text-sm font-semibold">
                      Question {currentQuestion + 1} of {exam.questions.length}
                    </p>
                    <div className="flex gap-2">
                      {answers[exam.questions[currentQuestion].id] !== null && (
                        <span className="px-2 py-1 rounded-lg text-xs bg-green-100 text-green-600">Answered</span>
                      )}
                    </div>
                  </div>
                  <p className="text-slate-800 mb-4 text-lg">{exam.questions[currentQuestion].question}</p>
                  <div className="grid gap-3">
                    {exam.questions[currentQuestion].options.map((opt, optIdx) => (
                      <label
                        key={optIdx}
                        className={`border rounded-xl px-4 py-3 cursor-pointer transition ${
                          answers[exam.questions[currentQuestion].id] === optIdx ? "border-blue-600 bg-blue-50" : "border-slate-200"
                        }`}
                      >
                        <input
                          type="radio"
                          className="hidden"
                          name={exam.questions[currentQuestion].id}
                          value={optIdx}
                          checked={answers[exam.questions[currentQuestion].id] === optIdx}
                          onChange={() => setAnswers({ ...answers, [exam.questions[currentQuestion].id]: optIdx })}
                        />
                        {opt}
                      </label>
                    ))}
                  </div>
                  
                  <div className="flex justify-between mt-6">
                    <button
                      onClick={handlePrevious}
                      disabled={currentQuestion === 0}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50"
                    >
                      ← Previous
                    </button>
                    <button
                      onClick={handleNext}
                      disabled={currentQuestion === exam.questions.length - 1}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50"
                    >
                      Next →
                    </button>
                  </div>
                </div>
              )}

              <button onClick={handleSubmit} className="w-full mt-4 py-3 rounded-xl bg-green-600 text-white font-semibold">
                Submit Exam
              </button>
            </div>

            <div className="w-64 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm h-fit">
              <h3 className="font-semibold text-slate-800 mb-3">Question Navigator</h3>
              <div className="grid grid-cols-5 gap-2">
                {exam.questions.map((q, idx) => (
                  <button
                    key={q.id}
                    onClick={() => handleJumpToQuestion(idx)}
                    className={`w-10 h-10 rounded-lg text-sm font-semibold transition ${
                      currentQuestion === idx
                        ? "bg-blue-600 text-white"
                        : answers[q.id] !== null
                        ? "bg-green-100 text-green-700 border border-green-200"
                        : "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200"
                    }`}
                  >
                    {idx + 1}
                  </button>
                ))}
              </div>
              <div className="mt-4 pt-4 border-t border-slate-200">
                <div className="flex items-center gap-2 text-sm text-slate-600">
                  <div className="w-3 h-3 rounded bg-blue-600"></div>
                  <span>Current</span>
                </div>
                <div className="flex items-center gap-2 text-sm text-slate-600 mt-1">
                  <div className="w-3 h-3 rounded bg-green-100 border border-green-200"></div>
                  <span>Answered</span>
                </div>
                <div className="flex items-center gap-2 text-sm text-slate-600 mt-1">
                  <div className="w-3 h-3 rounded bg-slate-100 border border-slate-200"></div>
                  <span>Not Answered</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        {showResult && resultData && (
          <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
              <div className="text-center">
                <p className="text-green-600 font-bold text-lg mb-2">Exam Submitted Successfully!</p>
                {resultData.showResultImmediately !== false && (
                  <>
                    <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center ${resultData.passed ? 'bg-green-100' : 'bg-red-100'}`}>
                      <span className="text-4xl">{resultData.passed ? 'PASS' : 'FAIL'}</span>
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800 mt-4">
                      {resultData.passed ? 'Congratulations!' : 'Better luck next time!'}
                    </h2>
                  </>
                )}
                <p className="text-slate-600 mt-2">{resultData.message}</p>
              </div>

              {resultData.showResultImmediately !== false ? (
                <div className="bg-slate-50 rounded-xl p-4 space-y-3">
                  <div className="flex justify-between">
                    <span className="text-slate-600">Your Score</span>
                    <span className="font-bold text-slate-800">{resultData.totalScore}/{resultData.totalMarks}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Percentage</span>
                    <span className="font-bold text-slate-800">{resultData.percentage}%</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Correct</span>
                    <span className="font-bold text-green-600">{resultData.correctCount}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Incorrect</span>
                    <span className="font-bold text-red-600">{resultData.incorrectCount}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Skipped</span>
                    <span className="font-bold text-slate-600">{resultData.skippedCount}</span>
                  </div>
                </div>
              ) : (
                <div className="bg-slate-50 rounded-xl p-4 text-center text-slate-600">
                  Detailed result is disabled for this exam by admin settings.
                </div>
              )}

              <p className="text-sm text-slate-500 mt-3 text-center">Auto-logout in 5 seconds...</p>
              <button
                onClick={handleResultClose}
                className="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700"
              >
                Logout Now
              </button>
            </div>
          </div>
        )}
        </>
      );
    }

    function StudentResults() {
      const [results, setResults] = useState([]);
      useEffect(() => {
        api.get("/results/student").then((res) => setResults(res.data));
      }, []);

      return (
        <div className="space-y-6">
          <div>
            <h1 className="text-2xl font-bold text-slate-800">My Results</h1>
            <p className="text-slate-500">Track your performance across attempts.</p>
          </div>

          <Table columns={[
            { key: "exam", label: "Exam" },
            { key: "score", label: "Score" },
            { key: "percentage", label: "Percentage" },
            { key: "status", label: "Status" },
          ]} data={results.map((r) => ({
            exam: r.exam?.title || "N/A",
            score: `${r.totalScore}/${r.totalMarks}`,
            percentage: r.percentage + "%",
            status: r.passed ? "Pass" : "Fail",
          }))} />
        </div>
      );
    }

    function AdminLayout() {
      const { branding } = useBranding();
      const { logout } = useAuth();
      const navigate = useNavigate();
      const location = useLocation();
      const links = [
        { to: "/admin", label: "Dashboard", exact: true },
        { to: "/admin/students", label: "Students" },
        { to: "/admin/questions", label: "Questions" },
        { to: "/admin/exams", label: "Exams" },
        { to: "/admin/courses", label: "Courses" },
        { to: "/admin/results", label: "Results" },
        { to: "/admin/settings", label: "Settings" },
      ];

      return (
        <div className="min-h-screen flex bg-slate-100">
          <aside className="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
            <div className="p-6 border-b border-slate-200">
              <div className="flex items-center gap-3">
                {branding.logoUrl ? (
                  <img src={branding.logoUrl} alt="Logo" className="h-10 w-10 object-contain" />
                ) : (
                  <p className="text-xs text-blue-600 font-semibold uppercase tracking-[0.3em]">GCE</p>
                )}
                <div>
                  <h2 className="text-xl font-bold text-slate-800">{branding.instituteName || "Admin Panel"}</h2>
                  <p className="text-sm text-slate-500">Admin Panel</p>
                </div>
              </div>
            </div>
            <nav className="p-4 space-y-2 flex-1">
              {links.map((link) => {
                const active = location.pathname === link.to || location.pathname === link.to.replace(/\/$/, "");
                return (
                  <Link
                    key={link.to}
                    to={link.to}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition ${active ? "bg-blue-50 text-blue-600" : "text-slate-600 hover:bg-slate-50"}`}
                  >
                    {link.label}
                  </Link>
                );
              })}
            </nav>
            <button className="m-4 px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-semibold" onClick={logout}>
              Logout
            </button>
          </aside>

          <main className="flex-1 p-6">
            <div className="md:hidden mb-4 flex justify-between items-center">
              <h1 className="text-xl font-bold">Admin Panel</h1>
              <button className="px-3 py-2 text-sm rounded-xl border border-slate-200" onClick={logout}>Logout</button>
            </div>
            <div className="space-y-6">
              <Routes>
                <Route index element={<AdminDashboard />} />
                <Route path="students" element={<ManageStudents />} />
                <Route path="questions" element={<ManageQuestions />} />
                <Route path="exams" element={<ManageExams />} />
                <Route path="courses" element={<ManageCourses />} />
                <Route path="results" element={<ViewResults />} />
                <Route path="settings" element={<Settings />} />
              </Routes>
            </div>
          </main>
        </div>
      );
    }

    function StudentLayout() {
      const { branding } = useBranding();
      const { logout, user } = useAuth();
      return (
        <div className="min-h-screen bg-slate-100">
          <header className="bg-white shadow-sm border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-3">
                  {branding.logoUrl && <img src={branding.logoUrl} alt="Logo" className="h-10 w-10 object-contain" />}
                  <div>
                    <p className="text-xs uppercase tracking-[0.3em] text-blue-600 font-semibold">{branding.instituteName || "GCE"}</p>
                    <h1 className="text-xl font-bold text-slate-800">Student Portal</h1>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="text-right">
                  <p className="text-sm font-semibold text-slate-700">{user?.name}</p>
                  <p className="text-xs text-slate-500">{user?.studentId}</p>
                </div>
                <button onClick={logout} className="px-3 py-2 rounded-xl border border-slate-200 text-sm font-semibold">Logout</button>
              </div>
            </div>
          </header>
          <main className="max-w-6xl mx-auto px-6 py-6">
            <Routes>
              <Route index element={<StudentDashboard />} />
              <Route path="exam/:id" element={<ExamPage />} />
              <Route path="results" element={<StudentResults />} />
            </Routes>
          </main>
        </div>
      );
    }

    function App() {
      return (
        <HashRouter>
          <Routes>
            <Route path="/login" element={<Login />} />
            <Route path="/admin/*" element={<ProtectedRoute role="admin"><AdminLayout /></ProtectedRoute>} />
            <Route path="/student/*" element={<ProtectedRoute role="student"><StudentLayout /></ProtectedRoute>} />
            <Route path="*" element={<Navigate to="/login" />} />
          </Routes>
        </HashRouter>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <BrandingProvider>
        <NotificationProvider>
          <AuthProvider>
            <App />
          </AuthProvider>
        </NotificationProvider>
      </BrandingProvider>
    );
  </script>
</body>
</html>
